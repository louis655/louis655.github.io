<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>celebrate.glb 预览</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f12; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding: 10px 14px; font-size: 13px; letter-spacing: .2px;
      background: rgba(0,0,0,.5); backdrop-filter: blur(10px);
    }
    .bar b { color: #60a5fa; }
    .bar .hint { opacity: .6; }
    .status {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 999px; font-size: 13px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      z-index: 10; transition: opacity .4s;
    }
    .status.done { opacity: 0; pointer-events: none; }
    .error {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 20; background: rgba(15,15,18,.95); text-align: center; padding: 24px;
    }
    .error p { max-width: 420px; color: #f87171; line-height: 1.6; }
    .error code { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 8px; background: rgba(239,68,68,.12); font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="bar">
    <span><b>celebrate.glb</b> · 5.0 MB · 压缩 10×</span>
    <span class="hint">红润暖调肤色 · 哑光无反光 · 抗锯齿边缘</span>
  </div>
  <div class="status" id="status">正在加载模型...</div>

  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const status = document.getElementById('status');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 200);
    camera.position.set(0.7, 0.5, 1.2);

    // MSAA 抗锯齿：边缘圆滑无锯齿
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    // 柔和布光，避免高光“反光”
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(1, 2, 1.5); scene.add(key);
    const fill = new THREE.DirectionalLight(0xffe6d5, 0.45); fill.position.set(-1.5, 1, -1); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffcda0, 0.3); rim.position.set(0, -1, -2); scene.add(rim);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.45, 0);
    controls.autoRotate = true;            // 慢速自转，便于检查边缘是否圆滑
    controls.autoRotateSpeed = 0.8;

    const draco = new DRACOLoader();
    draco.setDecoderPath('https://unpkg.com/three@0.170.0/examples/jsm/libs/draco/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);
    loader.setMeshoptDecoder(MeshoptDecoder);

    const clock = new THREE.Clock();
    let mixer = null;

    const modelPath = new URLSearchParams(location.search).get('m') || 'models/celebrate.glb';
    document.querySelector('.bar b').textContent = modelPath.split('/').pop();
    loader.load(
      modelPath,
      (gltf) => {
        const model = gltf.scene;
        model.traverse((c) => {
          if (c.isMesh && c.material) {
            c.material.envMapIntensity = 0.3;   // 降低环境反射，哑光观感（避免冷调）
            c.castShadow = c.receiveShadow = true;
          }
        });
        scene.add(model);

        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
          status.textContent = `动画: ${gltf.animations.map(a => a.name).join(', ')} ▶`;
        } else {
          status.textContent = '模型已加载（哑光肤质 · 无反光）';
        }

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.copy(center).add(new THREE.Vector3(maxDim * 1.3, maxDim * 0.7, maxDim * 1.4));
        controls.target.copy(center);
        controls.update();
        setTimeout(() => status.classList.add('done'), 1800);
      },
      (xhr) => { if (xhr.lengthComputable) status.textContent = `加载中 ${Math.round(xhr.loaded / xhr.total * 100)}%`; },
      (err) => {
        console.error(err);
        status.textContent = '加载失败';
        const div = document.createElement('div');
        div.className = 'error';
        div.innerHTML = `<p>模型加载失败<br><code>${err.message || JSON.stringify(err)}</code></p>`;
        document.body.appendChild(div);
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
